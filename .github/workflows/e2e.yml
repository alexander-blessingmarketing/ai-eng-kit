name: E2E

on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (gegen Vercel-Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel Preview
        id: vercel-preview
        continue-on-error: true
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Skip if no Vercel preview
        if: steps.vercel-preview.outcome != 'success' || steps.vercel-preview.outputs.url == ''
        run: |
          echo "::notice::Keine Vercel-Preview verfuegbar (Vercel-GitHub-Integration nicht aktiv?). E2E uebersprungen."

      - name: Run Playwright
        if: steps.vercel-preview.outcome == 'success' && steps.vercel-preview.outputs.url != ''
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel-preview.outputs.url }}

      - name: Upload report
        if: always() && steps.vercel-preview.outcome == 'success' && steps.vercel-preview.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
